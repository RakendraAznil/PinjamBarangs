<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinjamBarangs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">PinjamBarang</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="index.html">Beranda</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="tambah-barang.html"
                  >Tawarkan Barang</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="detail-barang.html">Detail & Form</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-4">
      <section class="card shadow-sm p-4 mb-4">
        <h2 class="h4 text-primary mb-3">Cari Barang</h2>
        <form class="row g-3" id="form-search">
          <div class="col-md-6">
            <label for="search-input" class="form-label">Kata Kunci</label>
            <input
              type="text"
              class="form-control"
              id="search-input"
              placeholder="Cari proyektor, tripod..."
            />
          </div>
          <div class="col-md-4">
            <label for="category-select" class="form-label">Kategori</label>
            <select id="category-select" class="form-select">
              <option value="">Semua Kategori</option>
              <option value="Elektronik & Media">Elektronik & Media</option>
              <option value="Alat Praktikum">Alat Praktikum</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Cari</button>
          </div>
        </form>
      </section>

      <section class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 text-primary m-0">
            Barang Tersedia (<span id="total-barang-count">0</span>)
          </h2>
          <button id="btn-toggle-info" class="btn btn-outline-secondary btn-sm">
            Sembunyikan / Tampilkan Info
          </button>
        </div>

        <div
          id="katalog-container"
          class="row row-cols-1 row-cols-md-3 g-4"
        ></div>
      </section>

      <!-- Tabel Data Tabular (Ketentuan Peminjaman Publik) -->
      <section class="card shadow-sm p-4">
        <h2 class="h4 text-primary mb-3">Ketentuan Peminjaman</h2>
        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead class="table-primary">
              <tr>
                <th>No</th>
                <th>Kategori Barang</th>
                <th>Maksimal Durasi</th>
                <th>Jaminan</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Elektronik & Media</td>
                <td>2 Hari</td>
                <td>KTM Asli</td>
              </tr>
              <tr>
                <td>2</td>
                <td>Peralatan Event</td>
                <td>3 Hari</td>
                <td>KTM Asli / KTP</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
      <p class="mb-0">&copy; 2026 PinjamBarang - Proyek Fullstack Web</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/app.js"></script>
  </body>
</html>
